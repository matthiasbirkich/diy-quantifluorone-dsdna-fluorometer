<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .box { fill:#f7f7f7; stroke:#222; stroke-width:3; rx:16; }
      .label { font-family:Arial, sans-serif; font-size:28px; fill:#111; text-anchor:middle; }
      .small { font-family:Arial, sans-serif; font-size:22px; fill:#333; text-anchor:middle; }
      .axis { stroke:#222; stroke-width:5; marker-end:url(#arrow); }
      .guide { stroke:#777; stroke-width:2; stroke-dasharray:10 10; }
    </style>
  </defs>
  <rect x="50" y="260" width="180" height="100" class="box"/>
  <text x="140" y="305" class="label">485 nm LED</text>
  <text x="140" y="338" class="small">fixed 16 mA board</text>
  <rect x="300" y="260" width="190" height="100" class="box"/>
  <text x="395" y="305" class="label">Ex470BP-40</text>
  <text x="395" y="338" class="small">excitation filter</text>
  <rect x="565" y="235" width="170" height="150" class="box"/>
  <text x="650" y="295" class="label">E4941 tube</text>
  <text x="650" y="330" class="small">0.5 mL PCR tube</text>
  <text x="650" y="360" class="small">fixed sample position</text>
  <rect x="565" y="50" width="170" height="100" class="box"/>
  <text x="650" y="95" class="label">Em532BP-40</text>
  <text x="650" y="128" class="small">emission filter</text>
  <rect x="825" y="50" width="220" height="100" class="box"/>
  <text x="935" y="95" class="label">TSL2591</text>
  <text x="935" y="128" class="small">one sensor only</text>
  <line x1="230" y1="310" x2="295" y2="310" class="axis"/>
  <line x1="490" y1="310" x2="560" y2="310" class="axis"/>
  <line x1="650" y1="235" x2="650" y2="155" class="axis"/>
  <line x1="735" y1="100" x2="820" y2="100" class="axis"/>
  <line x1="650" y1="385" x2="650" y2="570" class="guide"/>
  <line x1="735" y1="310" x2="1070" y2="310" class="guide"/>
  <path d="M650 215 A95 95 0 0 1 745 310" fill="none" stroke="#222" stroke-width="4"/>
  <text x="735" y="220" class="label">90°</text>
  <text x="395" y="425" class="small">Excitation axis</text>
  <text x="815" y="190" class="small">Detection axis</text>
  <text x="600" y="625" class="small">The printed holder fixes the detection axis at 90° to the excitation axis.</text>
</svg>